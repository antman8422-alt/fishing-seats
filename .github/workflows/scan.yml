name: scan-seats

on:
  schedule:
    - cron: "0 */2 * * *"      # 2시간마다 (UTC)
  workflow_dispatch:           # Actions 탭에서 수동 실행 버튼

permissions:
  contents: write

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install -q requests beautifulsoup4

      - name: Refresh boat list weekly (Mondays 00:xx UTC)
        if: github.event_name == 'schedule'
        run: |
          if [ "$(date -u +%u-%H)" = "1-00" ]; then rm -f data/thefishing_boats.json; fi

      - name: Scan
        run: python fetch_seats.py

      - name: Commit data
        run: |
          git config user.name "seats-bot"
          git config user.email "seats-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && echo "no change" || (git commit -m "scan $(date -u +'%Y-%m-%d %H:%M')" && git push)
